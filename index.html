<!doctype html>
<html lang="ar" dir="rtl" data-theme="stealth" data-mode="night" data-drive="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The panel is black from the first frame the compositor produces.
         color-scheme settles the UA canvas before a single stylesheet has
         been fetched, and the inline block below then owns html, body and
         the mount point outright — so the black never waits on the bundle,
         the fonts, or React. A head unit powers on into darkness; it does
         not flash a document ground first.

         This is deliberately duplicated from base.css rather than imported:
         anything reached through the module graph is by definition too late
         to colour the first paint. Day Mode restores a light UA scheme from
         themes.css once the interface is up. -->
    <meta name="color-scheme" content="dark" />
    <style>
      :root { color-scheme: dark; }
      html, body, #hmi-root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: #000;
      }
    </style>

    <title>MUSTANG — نظام المعلومات والترفيه</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-ar-arabic-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-ar-arabic-500.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/plex-arabic.css" />
  </head>
  <body>
    <div id="hmi-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
